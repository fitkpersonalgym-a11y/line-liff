<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>体験予約</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="padding: 16px; font-family: sans-serif;">
  <h3>体験予約メッセージの編集</h3>
  <p style="font-size: 14px; color: #666;">内容を編集してから送信してください：</p>
  
  <textarea id="msg" rows="6" style="width:100%; box-sizing:border-box; padding:8px; font-size:16px;">【体験予約希望】
・お名前：
・ご希望種別（ピラティス / トレーニング）：
・第1希望日時：
・第2希望日時：
・第3希望日時：
・ご質問・ご要望：</textarea>

  <button id="btn" style="margin-top:16px; width:100%; padding:12px; background:#06C755; color:white; border:none; border-radius:8px; font-size:16px; font-weight:bold;">メッセージを送信する</button>

  <script>
    // ① LIFFの初期化（※後ほど取得するLIFF IDを入力します）
    liff.init({ liffId: "YOUR_LIFF_ID" }).then(() => {
      if (!liff.isLoggedIn()) {
        liff.login();
      }
    });

    // ② ボタンタップ時の処理
    document.getElementById('btn').addEventListener('click', () => {
      const text = document.getElementById('msg').value;
      liff.sendMessages([{ type: 'text', text: text }]).then(() => {
        liff.closeWindow(); // トーク画面に送信してLIFFを閉じる
      }).catch(err => alert('送信エラー: ' + err));
    });
  </script>
</body>
</html>
